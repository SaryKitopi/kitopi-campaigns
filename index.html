  rows.forEach(r => {
    brandSales[r.brand] = (brandSales[r.brand] || 0) + (r.sales_c || 0);
  });
  const nonOfSalesTotal = Object.entries(brandSales)
    .filter(([b]) => b !== OF_BRAND)
    .reduce((a, [, v]) => a + v, 0);
  const brandCofund = {};
  brandCofund[OF_BRAND] = 0.20 * totalCofund;
  Object.keys(brandSales).forEach(b => {
    if (b !== OF_BRAND) {

    }

  const brandAggSales = {};
  rows.forEach(r => {
    (brandAggSales[r.brand] ??= {})[r.agg] = (brandAggSales[r.brand]?.[r.agg] || 0) + (r.sales_c || 0);

  const brandAggDaySales = {};
  rows.forEach(r => {
    const k = `${r.brand}|${r.agg}`;
    (brandAggDaySales[k] ??= {})[r.day] = (brandAggDaySales[k]?.[r.day] || 0) + (r.sales_c || 0);
  });

    let newCofund = 0;
    if (COFUND_AGGS.includes(r.agg)) {

function deltaBadge(v, type, inverse=false) {
  if (v == null || isNaN(v)) return '<span class="delta-badge flat">—</span>';
  const good = inverse ? v < 0 : v > 0;
  const bad  = inverse ? v > 0 : v < 0;
  const cls = good ? 'pos' : bad ? 'neg' : 'flat';
  const txt = type === 'pp' ? fmt.pp(v) : fmt.pctDelta(v);
  return `<span class="delta-badge ${cls}">${txt}</span>`;
}
function stackedCell(row, col) {
  const v = row ? row[col.k] : null;
  const vStr = (v == null || isNaN(v)) ? '—' : col.valFmt(v);
  const vCls = col.emphasis ? 'v cm-emph' : 'v';
  let dHtml = '';
  if (col.vsKey && row) {
    const d = row[col.vsKey];
    if (d != null && !isNaN(d)) {
      const good = col.inverse ? d < 0 : d > 0;
      const bad  = col.inverse ? d > 0 : d < 0;
      const cls = good ? 'pos' : bad ? 'neg' : 'flat';
      let txt;
      if (col.deltaType === 'pct') {
        const arrow = d > 0 ? '▲' : d < 0 ? '▼' : '–';
        txt = `${arrow} ${fmt.pct(Math.abs(d), 0)}`;
      } else {
        txt = fmt.pp(d, 1);
      }
      dHtml = `<span class="d ${cls}">${txt}</span>`;
    }
  }
  const mainColor = col.signColor && v != null && !isNaN(v)
    ? (v > 0 ? 'color:var(--good)' : v < 0 ? 'color:var(--bad)' : '')
    : '';
  const styleAttr = mainColor ? ` style="${mainColor}"` : '';
  return `<td><div class="brand-cell"><span class="${vCls}"${styleAttr}>${vStr}</span>${dHtml}</div></td>`;
}
const SUMMARY_COLS = [
  { l: 'Sales $',    k: 'sales_c',  valFmt: fmt.money_long, vsKey: 'sales_vs', deltaType: 'pct' },
  { l: 'Disc %',     k: 'disc_c',   valFmt: v => fmt.pct(v,1), vsKey: 'disc_vs', deltaType: 'pp', inverse: true },
  { l: 'FCR %',      k: 'fcr_c',    valFmt: v => fmt.pct(v,1), vsKey: 'fcr_vs',  deltaType: 'pp', inverse: true },
  { l: 'Mktg %',     k: 'mktg_c',   valFmt: v => fmt.pct(v,1), vsKey: 'mktg_vs', deltaType: 'pp', inverse: true },
  { l: 'ALC %',      k: 'alc_c',    valFmt: v => fmt.pct(v,1), vsKey: 'alc_vs',  deltaType: 'pp', inverse: true },
  { l: 'CM %',       k: 'cmpct_c',  valFmt: v => fmt.pct(v,1), vsKey: 'cmpct_vs', deltaType: 'pp', emphasis: true },
  { l: 'CM $',       k: 'cm_c',     valFmt: fmt.money_long, vsKey: 'cm_vs', deltaType: 'pct' },
  { l: 'Inc. Sales', k: 'inc_sales',valFmt: fmt.money_signed_long, vsKey: null, signColor: true },
  { l: 'Inc. CM $',  k: 'inc_cm',   valFmt: fmt.money_signed_long, vsKey: null, signColor: true },
];
const COFUND_COL = { l: 'Co-fund $', k: 'cofund', valFmt: fmt.money_long, vsKey: null };
function colsForMode(mode) {
  if (mode !== 'by_agg') return SUMMARY_COLS;
  const cmIdx = SUMMARY_COLS.findIndex(c => c.k === 'cm_c');
  return [
    ...SUMMARY_COLS.slice(0, cmIdx + 1),
    COFUND_COL,
    ...SUMMARY_COLS.slice(cmIdx + 1)
  ];
}
function renderSummaryTable() {
  const rows = filtered();
  const singleAgg = S.campaign.aggregators.length <= 1;
  if (singleAgg && S.summaryMode === 'by_agg') {
    S.summaryMode = 'total';
  }
  const mode = S.summaryMode;
  document.querySelectorAll('#summary-mode-toggle button').forEach(btn => {
    const isByAgg = btn.dataset.mode === 'by_agg';
    btn.classList.toggle('hidden', isByAgg && singleAgg);
    btn.classList.toggle('active', btn.dataset.mode === mode);
    btn.onclick = () => { S.summaryMode = btn.dataset.mode; renderSummaryTable(); };
  });
  if (rows.length === 0) {
    document.getElementById('summary-content').innerHTML = '<div class="section" style="text-align:center;color:var(--ink-3);padding:24px">No data matches your filters.</div>';
    return;
  }
  let firstColLabel, groups;
  if (mode === 'total') {
    firstColLabel = 'Cluster';
    const by = {};
    rows.forEach(r => { (by[r.cluster] ??= []).push(r); });
    groups = S.campaign.clusters_list.filter(c => by[c]?.length)
      .map(c => ({ id: c, label: `Cluster ${c}`, rs: by[c] }));
  } else if (mode === 'by_agg') {
    firstColLabel = 'Aggregator';
    const by = {};
    rows.forEach(r => { (by[r.agg] ??= []).push(r); });
    groups = S.campaign.aggregators.filter(a => by[a]?.length)
      .map(a => ({ id: a, label: a, rs: by[a] }));
  } else {
    firstColLabel = 'Brand';
    const by = {};
    rows.forEach(r => { (by[r.brand] ??= []).push(r); });
    groups = Object.keys(by).map(b => ({ id: b, label: b, rs: by[b] }));
  }
  const groupData = groups.map(g => ({ ...g, agg: aggregate(g.rs) }));
  const cols = colsForMode(mode);
  const sk = S.summarySort[mode].key, asc = S.summarySort[mode].asc;
  groupData.sort((a, b) => {
    let av, bv;
    if (sk === 'label') { av = a.label; bv = b.label; }
    else { av = a.agg?.[sk] ?? -Infinity; bv = b.agg?.[sk] ?? -Infinity; }
    if (typeof av === 'string') return asc ? av.localeCompare(bv) : bv.localeCompare(av);
    return asc ? av - bv : bv - av;
  });
  const headers = [
    { k: 'label', l: firstColLabel, sort: true },
    ...cols.map(c => ({ k: c.k, l: c.l, sort: true }))
  ];
  const theadHtml = headers.map(h => {
    const cls = [];
    if (h.sort) cls.push('sortable');
    if (sk === h.k) cls.push('sorted' + (asc ? ' asc' : ''));
    const attr = h.sort ? ` data-sort="${h.k}"` : '';
    return `<th class="${cls.join(' ')}"${attr}>${h.l}</th>`;
  }).join('');
  const tbody = groupData.map(g => `
    <tr>
      <td>${g.label}</td>
      ${cols.map(c => stackedCell(g.agg, c)).join('')}
    </tr>
  `).join('');
  const totalAgg = aggregate(rows);
  const totalRow = `<tr class="total-row">
    <td>TOTAL</td>
    ${cols.map(c => stackedCell(totalAgg, c)).join('')}
  </tr>`;
  document.getElementById('summary-content').innerHTML = `
    <div class="table-scroll">
      <table class="tbl">
        <thead><tr>${theadHtml}</tr></thead>
        <tbody>${tbody}${totalRow}</tbody>
      </table>
    </div>`;
  document.querySelectorAll('#summary-content th[data-sort]').forEach(th => {
    th.onclick = () => {
      const k = th.dataset.sort;
      if (S.summarySort[mode].key === k) S.summarySort[mode].asc = !S.summarySort[mode].asc;
      else { S.summarySort[mode].key = k; S.summarySort[mode].asc = false; }
      renderSummaryTable();
    };
  });
}

function renderDailyScoreboard() {
  const rows = S.campaign.rows.filter(r => {
    if (S.clusterFilter !== 'all' && r.cluster !== S.clusterFilter) return false;
    if (S.aggFilter !== 'all' && r.agg !== S.aggFilter) return false;
    if (S.brandFilter !== 'all' && r.brand !== S.brandFilter) return false;
    return true;
  });
  const titleEl = document.getElementById('snap-title');
  if (titleEl) titleEl.textContent = `Daily scoreboard · ${S.campaign.days.length}-day read`;
  const byDay = {};
  S.campaign.days.forEach(d => byDay[d] = []);
  rows.forEach(r => byDay[r.day].push(r));
  const days = S.campaign.days.map(d => ({ day: d, a: aggregate(byDay[d]) }));
  const metrics = [
    { l: 'Sales $',    k: 'sales_c',   vsKey: 'sales_vs',  deltaType: 'pct', valFmt: fmt.money,            emphasis: true },
    { l: 'Inc. Sales', k: 'inc_sales', vsKey: null,        deltaType: null,  valFmt: fmt.money_signed, signColor: true, emphasis: true },
    { l: 'Disc %',     k: 'disc_c',    vsKey: 'disc_vs',   deltaType: 'pp',  valFmt: v => fmt.pct(v,1), inverse: true },
    { l: 'CM $',       k: 'cm_c',      vsKey: 'cm_vs',     deltaType: 'pct', valFmt: fmt.money },
    { l: 'Inc. CM $',  k: 'inc_cm',    vsKey: null,        deltaType: null,  valFmt: fmt.money_signed, signColor: true, emphasis: true },
  ];
  function trendFor(values, inverse) {
    const v = values.filter(x => x != null && !isNaN(x));
    if (v.length < 2) return { arrow: '→', cls: 'flat', verdict: '—' };
    const first = v[0], last = v[v.length-1];
    const change = (last - first) / Math.abs(first || 1);
    let up = 0, down = 0;
    for (let i = 1; i < v.length; i++) {
      if (v[i] > v[i-1]) up++;
      else if (v[i] < v[i-1]) down++;
    }
    const monoUp   = up === v.length - 1;
    const monoDown = down === v.length - 1;
    let arrow = '→', cls = 'flat', verdict = 'stable';
    if (monoUp && change > 0.08)     { arrow = '↗'; verdict = 'accelerating'; }
    else if (monoDown && change < -0.08){ arrow = '↘'; verdict = 'decelerating'; }
    else if (change > 0.05)          { arrow = '↗'; verdict = 'trending up'; }
    else if (change < -0.05)         { arrow = '↘'; verdict = 'trending down'; }
    else if (Math.abs(change) < 0.03){ arrow = '→'; verdict = 'steady'; }
    else                             { arrow = '→'; verdict = 'stable'; }
    if (arrow === '↗') cls = inverse ? 'down' : 'up';
    else if (arrow === '↘') cls = inverse ? 'up' : 'down';
    return { arrow, cls, verdict };
  }
  function cellHtml(val, delta, col) {
    if (val == null || isNaN(val)) return '<td><div class="v-cell"><span class="v">—</span></div></td>';
    const vStr = col.valFmt(val);
    let dHtml = '';
    if (col.vsKey && delta != null && !isNaN(delta)) {
      const good = col.inverse ? delta < 0 : delta > 0;
      const bad  = col.inverse ? delta > 0 : delta < 0;
      const cls = good ? 'pos' : bad ? 'neg' : 'flat';
      let txt;
      if (col.deltaType === 'pct') {
        const arrow = delta > 0 ? '▲' : delta < 0 ? '▼' : '–';
        txt = `${arrow} ${fmt.pct(Math.abs(delta), 0)}`;
      } else {
        txt = fmt.pp(delta, 1);
      }
      dHtml = `<span class="d ${cls}">${txt}</span>`;
    }
    const signStyle = col.signColor && val != null
      ? (val > 0 ? 'color:var(--good)' : val < 0 ? 'color:var(--bad)' : '')
      : '';
    const vCls = col.emphasis ? 'v big' : 'v';
    return `<td><div class="v-cell"><span class="${vCls}" style="${signStyle}">${vStr}</span>${dHtml}</div></td>`;
  }
  const trendDays = S.campaign.trend_days || S.campaign.days;
  const trendDaySet = new Set(trendDays);
  const thead = `<thead><tr>
    <th>Metric</th>
    ${days.map(d => `<th>${d.day}</th>`).join('')}
    <th>${trendDays.length}-day trend</th>
  </tr></thead>`;
  const tbody = metrics.map(m => {
    const dayCells = days.map(d => cellHtml(d.a?.[m.k], m.vsKey ? d.a?.[m.vsKey] : null, m)).join('');
    const vals = days.filter(d => trendDaySet.has(d.day)).map(d => d.a?.[m.k]);
    const t = trendFor(vals, m.inverse);
    const trendCell = `<td class="trend-cell"><span class="trend-arrow ${t.cls}">${t.arrow}</span><span class="trend-verdict">${t.verdict}</span></td>`;
    return `<tr class="${m.emphasis ? 'emph-row' : ''}"><td class="metric-label">${m.l}</td>${dayCells}${trendCell}</tr>`;
  }).join('');
  document.getElementById('daily-scoreboard').innerHTML = `<table class="scoreboard-tbl">${thead}<tbody>${tbody}</tbody></table>`;
}
function renderWinnersLosers() {
  const rows = filtered();
  const brandMap = {};
  rows.forEach(r => {
    if (!brandMap[r.brand]) brandMap[r.brand] = { brand: r.brand, cluster: r.cluster, rs: [] };
    brandMap[r.brand].rs.push(r);
  });
  const brands = Object.values(brandMap).map(b => {
    const a = aggregate(b.rs);
    return { brand: b.brand, cluster: b.cluster, inc_cm: a.inc_cm, sales_vs: a.sales_vs };
  });
  const winners = brands.filter(b => b.inc_cm > 0).sort((a,b) => b.inc_cm - a.inc_cm).slice(0, 3);
  const losers  = brands.filter(b => b.inc_cm < 0).sort((a,b) => a.inc_cm - b.inc_cm).slice(0, 3);
  function itemHtml(b, i) {
    return `<div class="wl-item">
      <span class="wl-rank">${i+1}</span>
      <span>
        <span class="wl-brand">${b.brand}</span>
        <span class="wl-sub">Cluster ${b.cluster} · Sales ${fmt.pctDelta(b.sales_vs,0)}</span>
      </span>
      <span class="wl-val">${fmt.money_signed(b.inc_cm)}</span>
    </div>`;
  }
  document.getElementById('winners-list').innerHTML = winners.length
    ? winners.map(itemHtml).join('')
    : '<div class="wl-empty">None in selection</div>';
  document.getElementById('losers-list').innerHTML = losers.length
    ? losers.map(itemHtml).join('')

}
